name: Verify financial review
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_url:
        description: Production URL to verify (empty runs local production build)
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PROTOTYPE_URL: ${{ inputs.production_url }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: headless-verification
          path: test-results/
          retention-days: 7
