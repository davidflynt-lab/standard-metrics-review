<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120"><title>01 · Strategy and alignment</title><metadata>{&quot;canvas&quot;: &quot;#F6F7F9&quot;, &quot;surface&quot;: &quot;#FFFFFF&quot;, &quot;subtle&quot;: &quot;#FAFBFC&quot;, &quot;ink&quot;: &quot;#202B3B&quot;, &quot;secondary&quot;: &quot;#586477&quot;, &quot;muted&quot;: &quot;#5C687A&quot;, &quot;border&quot;: &quot;#DFE3E9&quot;, &quot;accent&quot;: &quot;#3E4CCA&quot;, &quot;accent-soft&quot;: &quot;#E9ECFF&quot;, &quot;warning-bg&quot;: &quot;#FFF9EC&quot;, &quot;warning-border&quot;: &quot;#EAD5A8&quot;, &quot;warning-ink&quot;: &quot;#735017&quot;, &quot;ready-bg&quot;: &quot;#E9F5EE&quot;, &quot;ready-ink&quot;: &quot;#246542&quot;, &quot;review-bg&quot;: &quot;#FFF3D9&quot;, &quot;review-ink&quot;: &quot;#85560E&quot;, &quot;conflict-bg&quot;: &quot;#FFF0EF&quot;, &quot;conflict-ink&quot;: &quot;#A3342C&quot;, &quot;highlight-bg&quot;: &quot;#F2EDFF&quot;, &quot;highlight-border&quot;: &quot;#A58BDD&quot;, &quot;highlight-ink&quot;: &quot;#43338B&quot;, &quot;document-canvas&quot;: &quot;#EFF1F5&quot;, &quot;sticky&quot;: &quot;#FFF3B5&quot;}</metadata><rect data-name="Canvas" data-token-fill="canvas" x="0" y="0" width="1440" height="1120" rx="0" fill="#F6F7F9"/>
<text data-name="Session label" data-token-color="muted" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="600" fill="#5C687A"><tspan x="48" y="54">STANDARD METRICS · MIDPOINT DESIGN CHECKPOINT</tspan></text>
<text data-name="Title" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="40" font-weight="600" fill="#202B3B"><tspan x="48" y="128">Make financial suggestions reviewable.</tspan></text>
<text data-name="Candidate" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="20" font-weight="400" fill="#202B3B"><tspan x="48" y="177">David Flynt · Staff Product Designer and Design Engineer</tspan></text>
<text data-name="Session" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="400" fill="#586477"><tspan x="48" y="218">Wednesday, September 30 · 10:00 AM PT · 60-minute collaborative design session with Justin</tspan></text>
<g data-name="Problem frame" transform="translate(48,255)"><rect data-name="Problem surface" data-token-fill="accent-soft" x="0" y="0" width="1344" height="110" rx="10" fill="#E9ECFF"/>
<text data-name="Problem title" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="22" font-weight="600" fill="#202B3B"><tspan x="24" y="41">Fast review needs traceable meaning, not just a plausible number.</tspan></text>
<text data-name="Problem explanation" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="400" fill="#586477"><tspan x="24" y="74">Golden path: a board-deck ARR figure is mislabeled as GAAP Revenue. Correct the classification, retain both metrics, and stage the decision before publishing.</tspan></text></g>
<g data-name="4 working assumptions" transform="translate(48,393)"><rect data-name="Panel surface" data-token-fill="surface" x="0" y="0" width="660" height="460" rx="10" fill="#FFFFFF" stroke="#DFE3E9" data-token-stroke="border"/>
<text data-name="Panel heading" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="22" font-weight="600" fill="#202B3B"><tspan x="24" y="42">4 working assumptions</tspan></text>
<text data-name="Item heading / 01 · Primary persona" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="88">01 · Primary persona</tspan></text>
<text data-name="Item copy / 01 · Primary persona" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="116">A VC portfolio analyst reviews quarterly company reporting packets. Controllers and approvers</tspan><tspan x="24" y="137">are adjacent roles to validate.</tspan></text>
<text data-name="Item heading / 02 · Financial meaning" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="182">02 · Financial meaning</tspan></text>
<text data-name="Item copy / 02 · Financial meaning" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="210">$1.2M quarterly GAAP Revenue and $5.6M point-in-time ARR are distinct metrics. A</tspan><tspan x="24" y="231">classification error does not create a value conflict.</tspan></text>
<text data-name="Item heading / 03 · Source evidence" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="276">03 · Source evidence</tspan></text>
<text data-name="Item copy / 03 · Source evidence" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="304">Original source text, period and unit evidence remain immutable. Human corrections change the</tspan><tspan x="24" y="325">proposed mapping and leave a traceable source link.</tspan></text>
<text data-name="Item heading / 04 · Staging boundary" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="370">04 · Staging boundary</tspan></text>
<text data-name="Item copy / 04 · Staging boundary" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="398">Approval records a review decision. Golden-ledger publishing is a separate boundary with</tspan><tspan x="24" y="419">permissions and audit requirements to explore.</tspan></text></g>
<g data-name="4 open questions for Justin" transform="translate(732,393)"><rect data-name="Panel surface" data-token-fill="surface" x="0" y="0" width="660" height="460" rx="10" fill="#FFFFFF" stroke="#DFE3E9" data-token-stroke="border"/>
<text data-name="Panel heading" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="22" font-weight="600" fill="#202B3B"><tspan x="24" y="42">4 open questions for Justin</tspan></text>
<text data-name="Item heading / 01 · Metric governance" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="88">01 · Metric governance</tspan></text>
<text data-name="Item copy / 01 · Metric governance" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="116">Who owns canonical definitions: the company, fund operations, or the platform? Who can</tspan><tspan x="24" y="137">approve a mapping change?</tspan></text>
<text data-name="Item heading / 02 · Batch validation" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="182">02 · Batch validation</tspan></text>
<text data-name="Item copy / 02 · Batch validation" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="210">What evidence must be explicit before batch approval? Which issues must always block</tspan><tspan x="24" y="231">acceptance, regardless of extraction confidence?</tspan></text>
<text data-name="Item heading / 03 · Recurring rules" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="276">03 · Recurring rules</tspan></text>
<text data-name="Item copy / 03 · Recurring rules" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="304">Should a corrected mapping become a reusable rule? Is its scope one company, one fund, or</tspan><tspan x="24" y="325">multiple funds—and who reviews that rule?</tspan></text>
<text data-name="Item heading / 04 · Source hierarchy" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="600" fill="#202B3B"><tspan x="24" y="370">04 · Source hierarchy</tspan></text>
<text data-name="Item copy / 04 · Source hierarchy" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#586477"><tspan x="24" y="398">When the same metric and period genuinely disagree, how do we rank accounting systems,</tspan><tspan x="24" y="419">finance workbooks and board decks?</tspan></text></g>
<g data-name="AI workflow and session scope" transform="translate(48,881)"><rect data-name="Panel surface" data-token-fill="surface" x="0" y="0" width="1344" height="180" rx="10" fill="#FFFFFF" stroke="#DFE3E9" data-token-stroke="border"/>
<text data-name="Heading" data-token-color="ink" font-family="Arial, Inter, sans-serif" font-size="22" font-weight="600" fill="#202B3B"><tspan x="24" y="42">AI accelerated the setup; human judgment defined the review boundary.</tspan></text>
<text data-name="AI workflow note" data-token-color="secondary" font-family="Arial, Inter, sans-serif" font-size="16" font-weight="400" fill="#586477"><tspan x="24" y="80">AI helped generate synthetic financial fixtures, scaffold the workflow and pressure-test classification and approval edge cases. I chose the distinction between mapping errors and true</tspan><tspan x="24" y="104">source conflicts, kept evidence explicit, and removed conversational clutter to preserve calm density.</tspan></text>
<text data-name="Midpoint note" data-token-color="muted" font-family="Arial, Inter, sans-serif" font-size="14" font-weight="400" fill="#5C687A"><tspan x="24" y="143">Working prototype + rough editable canvas · Validate assumptions together · Sandbox: controller approval gate or genuine source conflict</tspan></text></g></svg>